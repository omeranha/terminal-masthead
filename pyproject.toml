[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-masthead"
version = "0.1.0"
description = "Fixed header with a PNG logo and a scrollable log viewer for the terminal."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "omeranha" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["terminal", "tui", "header", "viewer", "scrollback"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
]

[project.urls]
Homepage = "https://github.com/omeranha/terminal-masthead"
Issues = "https://github.com/omeranha/terminal-masthead/issues"

[tool.setuptools.packages.find]
include = ["masthead*"]
